name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # the monthly refresh starts this to republish

jobs:
  test-pipeline:
    name: Build and test the pipeline (DuckDB, synthetic data)
    runs-on: ubuntu-latest
    env:
      START_YEAR: "2024"   # the synthetic sample starts in 2024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Generate synthetic NHTSA-shaped data
        run: cd ingestion && python sample_data.py
      - name: Load raw tables
        run: cd ingestion && python load.py
      - name: dbt build (models, unit tests, data tests)
        run: cd dbt && dbt build --profiles-dir . --target ci
      - name: Export dashboard data
        run: python scripts/export_dashboard.py
      - name: dbt docs (lineage graph) as one static page
        run: cd dbt && dbt docs generate --profiles-dir . --target ci --static
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/static_index.html

  deploy-dashboard:
    name: Publish dashboard and dbt docs to GitHub Pages
    needs: test-pipeline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # publishes the committed dashboard/ folder, including the dashboard.json
      # exported from the real NHTSA data; the docs come from the job above
      - uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: dashboard/lineage
      - run: mv dashboard/lineage/static_index.html dashboard/lineage/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
