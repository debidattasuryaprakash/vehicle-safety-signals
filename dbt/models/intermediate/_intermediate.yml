          - {make: ACME, model: ROADSTER, component_group: UNKNOWN OR OTHER, month: 2023-03-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: UNKNOWN OR OTHER, month: 2023-04-01, complaints: 5, data_through: 2025-01-01}
