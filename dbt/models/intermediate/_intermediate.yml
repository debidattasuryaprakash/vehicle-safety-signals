          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-01-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-02-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-03-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-04-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-05-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-06-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-07-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: STEERING, month: 2023-08-01, complaints: 10, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-01-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-02-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-03-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-04-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-05-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-06-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-07-01, complaints: 5, data_through: 2025-01-01}
          - {make: ACME, model: ROADSTER, component_group: AIR BAGS, month: 2023-08-01, complaints: 12, data_through: 2025-01-01}
      - input: ref('fct_recalls')
        rows:
          - {make: OTHER, model: VAN, component_group: BRAKES, report_received_date: 2023-08-10}
      - input: ref('stg_investigations')
        rows:
          - {make: OTHER, model: VAN, component_group: BRAKES, action_number: PE20001, action_type: PE, opened_date: 2020-01-01}
    expect:
      rows:
        - {component_group: STEERING, month: 2023-01-01, is_signal: false}
        - {component_group: STEERING, month: 2023-02-01, is_signal: false}
        - {component_group: STEERING, month: 2023-03-01, is_signal: false}
        - {component_group: STEERING, month: 2023-04-01, is_signal: false}
        - {component_group: STEERING, month: 2023-05-01, is_signal: false}
        - {component_group: STEERING, month: 2023-06-01, is_signal: false}
        - {component_group: STEERING, month: 2023-07-01, is_signal: false}
        - {component_group: STEERING, month: 2023-08-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-01-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-02-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-03-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-04-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-05-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-06-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-07-01, is_signal: false}
        - {component_group: AIR BAGS, month: 2023-08-01, is_signal: true}

  - name: catch_all_component_is_never_flagged
