  - name: investigation_in_the_signal_month_counts
    description: An NHTSA investigation of the same model and component opened during the signal month is recorded, with a negative lead time. A petition (DP) and an investigation of another component are ignored.
    model: mart_model_component_monthly
    overrides:
      vars: *signal_vars
    given:
      - input: ref('int_model_component_month_counts')
